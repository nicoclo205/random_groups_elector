<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creación de grupos</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style type="text/tailwindcss">
      @theme {
        --color-void: #0c0c0e;
        --color-paper: #f7f5f1;
        --color-ink: #1b1a18;
        --color-cream: #f2ece0;

        --color-type-a: oklch(0.90 0.045 235);
        --color-type-a-fg: oklch(0.44 0.09 250);
        --color-type-a-line: oklch(0.78 0.06 240);
        --color-type-b: oklch(0.92 0.055 88);
        --color-type-b-fg: oklch(0.46 0.09 70);
        --color-type-b-line: oklch(0.82 0.07 85);
        --color-type-c: oklch(0.91 0.045 158);
        --color-type-c-fg: oklch(0.43 0.07 160);
        --color-type-c-line: oklch(0.80 0.06 158);
        --color-type-d: oklch(0.90 0.05 38);
        --color-type-d-fg: oklch(0.47 0.09 32);
        --color-type-d-line: oklch(0.80 0.07 35);

        --color-warn: oklch(0.55 0.12 35);
        --color-warn-line: oklch(0.82 0.09 40);
        --color-good: oklch(0.55 0.08 155);

        --font-body: 'Karla', system-ui, sans-serif;
        --font-display: 'Bricolage Grotesque', system-ui, sans-serif;

        --animate-breathe: breathe 9s ease-in-out infinite;
        @keyframes breathe { 0%,100% { opacity:.5; transform: scale(1); } 50% { opacity:.85; transform: scale(1.06); } }

        --animate-glimmer: glimmer 3.4s ease-in-out infinite;
        @keyframes glimmer { 0%,100% { opacity:.25; } 50% { opacity:.6; } }

        --animate-dawn: dawn 0.5s ease both;
        @keyframes dawn { from { opacity:0; } to { opacity:1; } }

        --animate-rise: rise .6s cubic-bezier(.22,1,.36,1) both;
        @keyframes rise { from { opacity:0; transform: translateY(14px) scale(.97); } to { opacity:1; transform:none; } }
      }
    </style>
</head>
<body class="min-h-screen bg-paper text-ink font-body">

    <!-- Capa negra fija: cubre "sin datos" y "leyendo". Solo ella se
         desvanece (al pasar a "cargado"); el cambio entre sus dos
         contenidos internos es instantáneo, sin transición. -->
    <section id="phaseCover" class="fixed inset-0 z-50 flex items-center justify-center bg-void text-cream overflow-hidden transition-opacity duration-700">

        <!-- ESTADO 1: sin datos cargados -->
        <div id="phase-void" class="relative flex flex-col items-center justify-center px-6 py-12">
            <div class="absolute w-[900px] h-[900px] rounded-full pointer-events-none animate-breathe" style="background: radial-gradient(circle, rgba(233,224,205,.16) 0%, rgba(233,224,205,.05) 38%, transparent 68%);"></div>
            <div class="relative flex flex-col items-center gap-8 text-center max-w-2xl">
                <div class="text-[11px] tracking-[0.34em] uppercase text-cream/35">Capstone</div>
                <h1 class="font-display font-normal text-5xl sm:text-6xl md:text-7xl leading-none tracking-tight text-cream">Creación de grupos</h1>
                <div class="flex flex-col items-center gap-4 mt-1">
                    <label class="flex items-center gap-3.5 pl-6 pr-8 py-4 border border-dashed border-cream/25 rounded-full cursor-pointer text-cream/80 text-[14.5px] transition-all duration-300 hover:border-cream/55 hover:bg-cream/5 hover:text-cream whitespace-nowrap">
                        <span class="w-2.5 h-2.5 rounded-full bg-cream animate-glimmer"></span>
                        Arrastra el archivo .xlsx o haz clic
                        <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" class="hidden">
                    </label>
                </div>
            </div>
        </div>

        <!-- ESTADO 2: leyendo -->
        <div id="phase-reading" class="hidden flex-col items-center justify-center gap-6">
            <div class="w-3.5 h-3.5 rounded-full bg-cream animate-breathe" style="animation-duration:1.1s"></div>
            <div id="readingLabel" class="font-display text-2xl tracking-tight text-cream/70">Leyendo...</div>
        </div>

    </section>

    <!-- ESTADO 3: grupos cargados -->
    <section id="phase-loaded" class="hidden animate-dawn pb-24">

        <header class="sticky top-0 z-20 backdrop-blur-md bg-paper/90 border-b border-ink/10">
            <div class="max-w-[1420px] mx-auto px-6 md:px-8 py-5 flex items-center gap-7 flex-wrap">
                <div class="font-display text-2xl tracking-tight mr-auto">Creación de grupos</div>

                <div class="flex items-center gap-2.5">
                    <span class="text-[12.5px] text-ink/50">Tamaño</span>
                    <div class="flex items-center gap-0.5 bg-ink/5 rounded-full p-1">
                        <button id="sizeDec" class="w-7 h-7 rounded-full leading-none text-base text-ink/55 hover:bg-ink hover:text-paper transition">−</button>
                        <span id="sizeVal" class="min-w-[22px] inline-block text-center text-[15px] font-medium">5</span>
                        <button id="sizeInc" class="w-7 h-7 rounded-full leading-none text-base text-ink/55 hover:bg-ink hover:text-paper transition">+</button>
                    </div>
                </div>

                <button id="reshuffleBtn" class="flex items-center gap-2 border border-ink/15 rounded-full px-5 py-2.5 text-[13.5px] transition-all hover:bg-ink hover:text-paper">
                    <span id="reshuffleIcon" class="inline-block text-[15px] transition-transform duration-700" style="transform: rotate(0deg)">↻</span> Rebarajar
                </button>

                <div class="flex gap-2">
                    <button id="exportCsvBtn" class="border border-ink/15 rounded-full px-4 py-2.5 text-[13px] hover:bg-ink hover:text-paper transition">CSV</button>
                    <button id="exportXlsxBtn" class="border border-ink/15 rounded-full px-4 py-2.5 text-[13px] hover:bg-ink hover:text-paper transition">Excel</button>
                    <button id="resetBtn" class="flex items-center gap-1.5 rounded-full px-4 py-2.5 text-[13px] text-ink/45 hover:text-[oklch(0.52_0.13_32)] transition">
                        <span class="text-sm leading-none">×</span> Borrar Excel
                    </button>
                </div>
            </div>

            <div id="legend" class="max-w-[1420px] mx-auto px-6 md:px-8 pb-4 flex gap-5 flex-wrap items-center"></div>
        </header>

        <main id="groupsGrid" class="max-w-[1420px] mx-auto px-6 md:px-8 pt-8 grid gap-5 items-start" style="grid-template-columns: repeat(auto-fill, minmax(272px, 1fr));"></main>

    </section>

    <!-- Tarjeta flotante al pasar el mouse por una persona -->
    <div id="hoverCard" class="hidden fixed left-6 bottom-6 z-40 bg-ink text-cream rounded-[20px] px-5 py-4 items-center gap-4 shadow-2xl animate-rise pointer-events-none"></div>

    <script src="app.js"></script>
</body>
</html>
